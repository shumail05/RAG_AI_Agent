services:
  - type: web
    name: rag-agent-backend
    env: docker
    dockerfilePath: Dockerfile
    build:
      context: .
    healthCheck:
      path: /health
    envVars:
      - key: GROQ_API_KEY
        fromEnvironment: true
      - key: PINECONE_API_KEY
        fromEnvironment: true
      - key: PINECONE_ENVIRONMENT
        value: us-east-1
      - key: PINECONE_INDEX_NAME
        value: rag-index
      - key: TAVILY_API_KEY
        fromEnvironment: true
      - key: JINA_API_KEY
        fromEnvironment: true
    autoDeploy: true
